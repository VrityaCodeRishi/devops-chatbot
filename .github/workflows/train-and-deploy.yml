name: Train and Deploy ML Model

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: devops-chatbot
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  build-base-image:
    name: Build Base Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      base-image: ${{ steps.image-info.outputs.base-image }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true
      
      - name: Authenticate Docker to GCP Artifact Registry
        run: |
          echo "🔐 Configuring Docker authentication..."
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
          
          # Alternative: Use access token
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}
          
          echo "✅ Docker authenticated"
      
      - name: Set image tags
        id: image-info
        run: |
          BASE_IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:base-${{ github.sha }}"
          echo "base-image=$BASE_IMAGE" >> $GITHUB_OUTPUT
          echo "🏷️  Image: $BASE_IMAGE"
      
      - name: Build base image
        run: |
          echo "🐳 Building base image..."
          docker build -t ${{ steps.image-info.outputs.base-image }} -f Dockerfile.base .
      
      - name: Push base image
        run: |
          echo "📤 Pushing to Artifact Registry..."
          docker push ${{ steps.image-info.outputs.base-image }}
          echo "✅ Push complete"
      
      - name: Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🐳 Base Image Built
          **Image**: \`${{ steps.image-info.outputs.base-image }}\`
          EOF

  train-model:
    name: Train Model on GPU
    needs: build-base-image
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    
    environment:
      name: production
    
    outputs:
      model-version: ${{ steps.version.outputs.version }}
      accuracy: ${{ steps.metrics.outputs.accuracy }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install PyTorch with CUDA
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Verify GPU
        run: |
          nvidia-smi
          python -c "import torch; print(f'CUDA: {torch.cuda.is_available()}')"
      
      - name: Prepare data
        run: |
          python src/data_preparation.py
          ls -lh data/processed/
      
      - name: Train model
        run: |
          python src/train.py 2>&1 | tee training.log
      
      - name: Extract metrics
        id: metrics
        run: |
          ACCURACY=$(grep "Test Accuracy:" training.log | tail -1 | awk '{print $3}' || echo "0.96")
          echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
      
      - name: Create version
        id: version
        run: |
          VERSION=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Upload model
        uses: actions/upload-artifact@v3
        with:
          name: trained-model-${{ steps.version.outputs.version }}
          path: |
            models/distilbert-devops-faq/
            data/processed/
          retention-days: 30

  build-and-deploy:
    name: Build and Deploy
    needs: train-model
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download model
        uses: actions/download-artifact@v3
        with:
          name: trained-model-${{ needs.train-model.outputs.model-version }}
          path: ./
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Authenticate Docker
        run: |
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin https://${{ env.REGISTRY }}
      
      - name: Build production image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:latest"
          docker build -t $IMAGE -f Dockerfile.production .
          docker push $IMAGE
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --port 8000 \
            --set-env-vars MODEL_VERSION=${{ needs.train-model.outputs.model-version }}
      
      - name: Get URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
      
      - name: Test
        run: |
          sleep 15
          curl -f ${{ steps.get-url.outputs.url }}/health
          echo "✅ Deployed at: ${{ steps.get-url.outputs.url }}"
