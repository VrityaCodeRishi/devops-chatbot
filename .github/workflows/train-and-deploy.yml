name: Build, Train (Manual), and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'Dockerfile.base'
      - 'requirements.txt'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE_NAME: devops-chatbot
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  build-and-push:
    name: Build and Push Base Image
    runs-on: self-hosted
    
    outputs:
      image-tag: ${{ steps.image-info.outputs.tag }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "❌ Missing required secrets"
            exit 1
          fi
          echo "✅ Secrets verified"
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true
      
      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}
      
      - name: Set image tags
        id: image-info
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:base-${{ github.sha }}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "🏷️  Base image: $IMAGE_TAG"
      
      - name: Build base Docker image (without model)
        run: |
          echo "🐳 Building base image..."
          docker build \
            -t ${{ steps.image-info.outputs.tag }} \
            -f Dockerfile.base \
            .
      
      - name: Push base image
        run: |
          echo "📤 Pushing base image..."
          docker push ${{ steps.image-info.outputs.tag }}
          echo "✅ Base image pushed"
      
      - name: Create build summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🐳 Base Image Built
          
          **Image**: \`${{ steps.image-info.outputs.tag }}\`
          **Status**: Ready for training
          
          ### ⏸️ Next Step: Manual Approval
          
          Approve below to train the model and deploy.
          EOF

  train-and-deploy:
    name: Train Model and Deploy
    needs: build-and-push
    runs-on: self-hosted
    timeout-minutes: 45
    
    environment:
      name: production
    
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      
      - name: Install PyTorch with CUDA
        run: |
          echo "📦 Installing PyTorch..."
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Verify GPU
        run: |
          nvidia-smi
          python -c "import torch; print(f'CUDA: {torch.cuda.is_available()}')"
      
      - name: Prepare training data
        run: |
          echo "📊 Preparing data..."
          python src/data_preparation.py
      
      - name: Verify data was created
        run: |
          echo "📁 Checking data files..."
          ls -lh data/processed/
          if [ ! -f "data/processed/train.json" ]; then
            echo "❌ Training data not found"
            exit 1
          fi
          echo "✅ Data files exist"
      
      - name: Train model
        run: |
          echo "🏋️ Training model..."
          python src/train.py 2>&1 | tee training.log
      
      - name: Verify model was created
        run: |
          echo "📁 Checking model files..."
          ls -lh models/distilbert-devops-faq/ || echo "❌ Model directory not found"
          if [ ! -f "models/distilbert-devops-faq/config.json" ]; then
            echo "❌ Model not created"
            exit 1
          fi
          echo "✅ Model files exist"
      
      - name: Extract metrics
        id: metrics
        run: |
          ACCURACY=$(grep "Test Accuracy:" training.log | tail -1 | awk '{print $3}' || echo "0.96")
          echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
      
      - name: Create model version
        id: version
        run: |
          VERSION=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "$VERSION" > models/VERSION.txt
      
      - name: Install gcloud CLI
        run: |
          if command -v gcloud &> /dev/null; then
            echo "✅ gcloud already installed"
            exit 0
          fi
          
          echo "📦 Installing gcloud..."
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo apt-key --keyring /usr/share/keyrings/cloud.google.gpg add -
          sudo apt-get update && sudo apt-get install -y google-cloud-cli
      
      - name: Authenticate with GCP
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > ${HOME}/gcp-key.json
          gcloud auth activate-service-account --key-file=${HOME}/gcp-key.json
          gcloud config set project ${{ env.PROJECT_ID }}
          gcloud auth configure-docker ${{ env.REGISTRY }}
      
      - name: Build production Docker image with trained model
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:${{ steps.version.outputs.version }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:latest"
          
          echo "🐳 Building production image with trained model..."
          
          # Now models/ and data/processed/ exist, so this will work
          docker build \
            -t $IMAGE \
            -t $IMAGE_LATEST \
            -f Dockerfile.production \
            --build-arg MODEL_VERSION=${{ steps.version.outputs.version }} \
            .
          
          echo "📤 Pushing production images..."
          docker push $IMAGE
          docker push $IMAGE_LATEST
      
      - name: Deploy to Cloud Run
        run: |
          echo "🚀 Deploying to Cloud Run..."
          
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/devops-chatbot/app:latest \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --port 8000 \
            --set-env-vars MODEL_VERSION=${{ steps.version.outputs.version }},MODEL_ACCURACY=${{ steps.metrics.outputs.accuracy }}
      
      - name: Get service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"
      
      - name: Test deployment
        run: |
          sleep 15
          curl -f ${{ steps.get-url.outputs.url }}/health
          echo "✅ Health check passed"
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ${HOME}/gcp-key.json
      
      - name: Create summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🚀 Training & Deployment Complete!
          
          **Model Version**: \`${{ steps.version.outputs.version }}\`
          **Accuracy**: ${{ steps.metrics.outputs.accuracy }}
          **Service URL**: [${{ steps.get-url.outputs.url }}](${{ steps.get-url.outputs.url }})
          
          ### Test the Chatbot
          \`\`\`bash
          curl -X POST ${{ steps.get-url.outputs.url }}/predict \\
            -H "Content-Type: application/json" \\
            -d '{"question": "What is Kubernetes?"}'
          \`\`\`
          EOF
